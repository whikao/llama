name: build-llama-cpp-snapdragon-dual

on:
  workflow_dispatch:
    inputs:
      llama_cpp_ref:
        description: "llama.cpp 分支/tag/commit"
        required: false
        default: "master"

jobs:
  build-android-dual-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Clone official llama.cpp (unmodified)
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.llama_cpp_ref }}" \
            https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Build inside official Snapdragon toolchain container
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --volume ${{ github.workspace }}/llama.cpp:/workspace \
            ghcr.io/snapdragon-toolchain/arm64-android:v0.3 \
            bash -c "
              set -e &&
              echo '--- ensuring host libc headers exist ---' &&
              (apt-get update && apt-get install -y libc6-dev) || true &&
              echo '--- locating real host inttypes.h ---' &&
              HOSTHDR=\$(find /usr/include -maxdepth 2 -iname 'inttypes.h' ! -path '*android*' 2>/dev/null | head -n1 | xargs -r dirname) &&
              echo \"host include dir: \$HOSTHDR\" &&
              if [ -z \"\$HOSTHDR\" ]; then echo 'still not found, aborting'; exit 1; fi &&
              export CPLUS_INCLUDE_PATH=\"\$HOSTHDR\" &&
              export C_INCLUDE_PATH=\"\$HOSTHDR\" &&
              cd /workspace &&
              PRESET_FILE=\$(find docs -iname 'CMakeUserPresets.json' | head -n1) &&
              cp \"\$PRESET_FILE\" . &&
              cmake --preset arm64-android-snapdragon-release -B build-snapdragon &&
              cmake --build build-snapdragon -j\$(nproc) &&
              echo '--- key binaries ---' &&
              ls -la build-snapdragon/bin/llama-cli
            "

      - name: Package artifacts (only what's needed to run)
        run: |
          mkdir -p out
          cp llama.cpp/build-snapdragon/bin/llama-cli out/
          find llama.cpp/build-snapdragon -iname "libggml*.so" -exec cp {} out/ \;
          find llama.cpp/build-snapdragon -iname "libllama*.so" -exec cp {} out/ \;
          find llama.cpp/build-snapdragon -iname "libggml-htp-*.so" -exec cp {} out/ \;
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-snapdragon-dual-backend
          path: out/
