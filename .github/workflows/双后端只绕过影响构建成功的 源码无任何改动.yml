name: build-llama-cpp-snapdragon-dual

on:
  workflow_dispatch:
    inputs:
      llama_cpp_ref:
        description: "llama.cpp branch/tag/commit"
        required: false
        default: "master"
        type: string
      snapdragon_toolchain_tag:
        description: "Snapdragon Android toolchain image tag"
        required: false
        default: "v0.7"
        type: string

jobs:
  build-android-dual-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Clone official llama.cpp at requested ref
        shell: bash
        env:
          LLAMA_CPP_REF: ${{ inputs.llama_cpp_ref }}
        run: |
          set -euo pipefail

          git init llama.cpp
          cd llama.cpp
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin "${LLAMA_CPP_REF}"
          git checkout --detach FETCH_HEAD

          echo "Requested ref: ${LLAMA_CPP_REF}"
          echo "Resolved commit: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Build llama-cli + llama-bench + llama-server for Snapdragon Android
        shell: bash
        env:
          SNAPDRAGON_TOOLCHAIN_TAG: ${{ inputs.snapdragon_toolchain_tag }}
        run: |
          set -euo pipefail

          docker run --rm \
            --platform linux/amd64 \
            --volume "${{ github.workspace }}/llama.cpp:/workspace" \
            "ghcr.io/snapdragon-toolchain/arm64-android:${SNAPDRAGON_TOOLCHAIN_TAG}" \
            bash -lc '
              set -euo pipefail

              git config --global --add safe.directory /workspace

              echo "=== install real Linux host C++ compiler ==="
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++
              test -x /usr/bin/g++
              /usr/bin/g++ --version

              cd /workspace

              echo "=== install Snapdragon preset ==="
              test -f docs/backend/snapdragon/CMakeUserPresets.json
              cp docs/backend/snapdragon/CMakeUserPresets.json ./CMakeUserPresets.json

              rm -rf build-snapdragon

              echo "=== configure Snapdragon Android ==="
              cmake --preset arm64-android-snapdragon-release \
                -B build-snapdragon \
                -DHOST_CXX_COMPILER=/usr/bin/g++ \
                -DLLAMA_BUILD_COMMON=ON \
                -DLLAMA_BUILD_TOOLS=ON \
                -DLLAMA_BUILD_SERVER=ON \
                -DLLAMA_BUILD_UI=OFF \
                -DLLAMA_BUILD_TESTS=OFF \
                -DLLAMA_BUILD_EXAMPLES=OFF \
                -DLLAMA_BUILD_APP=OFF

              echo "=== verify configure ==="
              grep -q "GGML_OPENCL:BOOL=ON" build-snapdragon/CMakeCache.txt
              grep -q "GGML_HEXAGON:BOOL=ON" build-snapdragon/CMakeCache.txt
              grep -q "LLAMA_BUILD_TOOLS:BOOL=ON" build-snapdragon/CMakeCache.txt
              grep -q "LLAMA_BUILD_SERVER:BOOL=ON" build-snapdragon/CMakeCache.txt
              grep -q "HOST_CXX_COMPILER:FILEPATH=/usr/bin/g++" build-snapdragon/CMakeCache.txt || \
                grep -q "HOST_CXX_COMPILER.*=/usr/bin/g++" build-snapdragon/CMakeCache.txt

              echo "=== verify required Ninja targets exist ==="
              ninja -C build-snapdragon -t targets all | grep -q "^llama-cli:"
              ninja -C build-snapdragon -t targets all | grep -q "^llama-bench:"
              ninja -C build-snapdragon -t targets all | grep -q "^llama-server:"

              echo "=== build required executables ==="
              cmake --build build-snapdragon \
                --target llama-cli llama-bench llama-server \
                -j"$(nproc)"

              echo "=== verify executables ==="
              test -x build-snapdragon/bin/llama-cli
              test -x build-snapdragon/bin/llama-bench
              test -x build-snapdragon/bin/llama-server

              echo "=== verify Snapdragon backend libraries ==="
              test -f build-snapdragon/bin/libggml-opencl.so
              test -f build-snapdragon/bin/libggml-hexagon.so

              HTP_COUNT="$(find build-snapdragon/ggml/src/ggml-hexagon \
                -maxdepth 1 -type f -name "libggml-htp-v*.so" | wc -l)"
              test "${HTP_COUNT}" -gt 0

              echo "HTP libraries: ${HTP_COUNT}"
              find build-snapdragon/ggml/src/ggml-hexagon \
                -maxdepth 1 -type f -name "libggml-htp-v*.so" -print | sort

              echo "=== ELF architecture ==="
              for f in \
                build-snapdragon/bin/llama-cli \
                build-snapdragon/bin/llama-bench \
                build-snapdragon/bin/llama-server; do
                echo "--- ${f}"
                readelf -h "${f}" | grep -E "Class:|Machine:"
              done

              echo "=== dynamic dependencies ==="
              for f in \
                build-snapdragon/bin/llama-cli \
                build-snapdragon/bin/llama-bench \
                build-snapdragon/bin/llama-server; do
                echo "--- ${f}"
                readelf -d "${f}" | grep NEEDED || true
              done
            '

      - name: Package runtime artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out
          mkdir -p out

          echo "=== copy executables ==="
          cp llama.cpp/build-snapdragon/bin/llama-cli out/
          cp llama.cpp/build-snapdragon/bin/llama-bench out/
          cp llama.cpp/build-snapdragon/bin/llama-server out/

          echo "=== copy all built Android shared libraries from bin ==="
          find llama.cpp/build-snapdragon/bin \
            -maxdepth 1 -type f \
            \( -name '*.so' -o -name '*.so.*' \) \
            -exec cp -f {} out/ \;

          echo "=== copy Hexagon HTP skel libraries ==="
          find llama.cpp/build-snapdragon/ggml/src/ggml-hexagon \
            -maxdepth 1 -type f -name 'libggml-htp-v*.so' \
            -exec cp -f {} out/ \;

          echo "=== final artifact verification ==="
          test -x out/llama-cli
          test -x out/llama-bench
          test -x out/llama-server
          test -f out/libggml-opencl.so
          test -f out/libggml-hexagon.so
          find out -maxdepth 1 -type f -name 'libggml-htp-v*.so' | grep -q .

          echo "=== packaged files ==="
          ls -lah out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-snapdragon-cli-bench-server
          path: out/
          if-no-files-found: error
          retention-days: 14
